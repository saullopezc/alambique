# modelos.conf — nombres de modelos o asistentes de IA que el guard de autoría
# no admite como autor, editor ni revisor (R-11)
#
# Destino real:  <conf>/_local/modelos.conf   (o $ALAMBIQUE_MODELOS)
#                (<conf> = directorio de configuración del harness)
# Es C1: no lleva datos de cliente. Pero es configuración del puesto: no se versiona.
# Responsable: <quien responde>
#
# Un nombre por línea; se AÑADE a la lista por defecto del guard (que ya trae
# los asistentes comerciales habituales). Las vacías y las que empiezan por `#`
# se ignoran. Se combinan con `|` en una expresión regular extendida, así que un
# punto o un paréntesis hay que escaparlos.
#
# QUÉ HACE: con `asistente-interno` aquí, un documento con "Autor: asistente-interno"
# o un "Co-Authored-By: asistente-interno" produce aviso al escribirlo.
# <nombre-del-modelo-interno>
# <otro-asistente>
