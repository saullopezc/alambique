# rutas-cliente.conf — raíces de servidor que el guard vigila (R-06)
#
# Destino real:  <conf>/_local/rutas-cliente.conf   (o $ALAMBIQUE_RUTAS)
#                (<conf> = directorio de configuración del harness: $ALAMBIQUE_CONF,
#                 o el primero que exista de ~/.claude, ~/.codex, ~/.gemini...)
# NO se versiona. Es C2. Responsable: <quien responde>
#
# Una expresión regular extendida por línea. Las vacías, las de solo espacios y
# las que empiezan por `#` se ignoran. Una que no vale como expresión, o que
# casa con cualquier orden, se ignora y el guard lo avisa. Se combinan con `|`,
# así que no hace falta agruparlas.
#
# QUÉ HACE: con este fichero, el guard reconoce que `rm -rf /opt/<producto>3/salida` toca
# infraestructura ajena y pide confirmación. Sin él, solo reconoce los comandos
# destructivos genéricos — que ya es la mitad del trabajo, pero no toda.
#
# POR QUÉ NO VAN DENTRO DEL GUARD: la ruta de instalación de un producto en el
# servidor de un cliente es una coordenada (R-03), y el guard se copia a cada
# puesto. Además, incrustarlas lo haría inservible para cualquier otro: sus
# rutas son otras. La regla se publica; el valor, no.
#
# CADA ENTRADA NECESITA UN DISCRIMINANTE. Una raíz como `/opt/<producto>` también
# existe en la máquina local: sin algo que la distinga, el guard salta en cada
# operación local, te acostumbras a aprobarlo, y el día que salta de verdad lo
# apruebas igual. Un control que salta siempre es un control apagado. El
# discriminante suele ser lo que solo existe en el destino: un índice de
# instancia, un código de entorno en mayúsculas. `/opt/<producto>[0-9]+/`
# marca `/opt/<producto>3/loquesea` y NO marca `src/<producto>/`.
#
# Los ejemplos son MARCADORES, no rutas: un fichero que enseña a no escribir
# coordenadas no puede contener una.

# /opt/<producto>[0-9]+/
# /datos/[A-Z]{2,}/entrada/
# /var/<area>/[0-9]{2,}/
